<!DOCTYPE html>
<html lang="ca">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Registre de feines</title>

<style>

body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: 40px auto;
  padding: 20px;
  text-align: center;
}

h1 {
  margin-bottom: 30px;
}

#pregunta {
  font-size: 24px;
  font-weight: bold;
  margin: 30px 0;
}

#estat {
  margin: 20px 0;
  color: #555;
}

button {
  font-size: 20px;
  padding: 15px 25px;
  margin: 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

#boto {
  background: #222;
  color: white;
}

.prova {
  background: #ddd;
  color: #222;
}

button:disabled {
  opacity: 0.5;
}

</style>

</head>

<body>

<h1>🎤 Registre de feines</h1>

<div id="pregunta">
  Prem «Començar registre»
</div>

<div id="estat"></div>

<button id="boto"
        onclick="comencar()">

  🎤 Començar registre

</button>

<button class="prova"
        onclick="provaEnviar()">

  🧪 PROVA ENVIAMENT

</button>

<iframe
  name="enviamentOcult"
  id="enviamentOcult"
  style="display:none;">
</iframe>

<script>

/* =====================================================
   CONFIGURACIÓ
===================================================== */

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbyCn9UPJIuY91m9iBzuOXmBFqf4bHw_80JYg0ZyhK91x1CrucWFh2IcyeJXIxkkDfuD/exec";


let pas = 0;

let dades = {};

let reconeixement = null;


/* =====================================================
   PREGUNTES
===================================================== */

const preguntes = [

  ["client", "Quin és el client?"],

  ["lloc", "A quin lloc has fet la feina?"],

  ["feina", "Quina feina has realitzat?"],

  ["hora_inici", "A quina hora has començat?"],

  ["hora_final", "A quina hora has acabat?"],

  ["material", "Quin material has utilitzat?"]

];


/* =====================================================
   NORMALITZAR TEXT
===================================================== */

function normalitzar(text) {

  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();

}


/* =====================================================
   DETECTAR SÍ
===================================================== */

function esSi(text) {

  const t = normalitzar(text);

  return (
    t === "si" ||
    t.startsWith("si ") ||
    t.includes("si,")
  );

}


/* =====================================================
   COMENÇAR REGISTRE
===================================================== */

function comencar() {

  dades = {};

  pas = 0;

  document.getElementById("boto").disabled = true;

  document.getElementById("estat").innerText =
    "Preparant registre...";

  preguntar();

}


/* =====================================================
   PREGUNTAR
===================================================== */

function preguntar() {

  let pregunta = "";

  if (pas < preguntes.length) {

    pregunta =
      preguntes[pas][1];

  }

  else if (pas === 6) {

    pregunta =
      "Hi ha material llogat?";

  }

  else if (pas === 7) {

    pregunta =
      "Quin material has llogat?";

  }

  else if (pas === 8) {

    pregunta =
      "Hi ha alguna feina nova per aquest client?";

  }

  else if (pas === 9) {

    pregunta =
      "Quina feina nova?";

  }

  else if (pas === 10) {

    pregunta =
      "Hi ha algun material pendent de demanar?";

  }

  else if (pas === 11) {

    pregunta =
      "Quin material queda pendent de demanar?";

  }

  else if (pas === 12) {

    pregunta =
      "Tens alguna observació?";

  }

  document.getElementById("pregunta").innerText =
    pregunta;

  parlar(pregunta);

}


/* =====================================================
   PARLAR
===================================================== */

function parlar(text) {

  window.speechSynthesis.cancel();

  const veu =
    new SpeechSynthesisUtterance(text);

  veu.lang = "ca-ES";

  veu.rate = 0.95;

  veu.pitch = 1;

  veu.volume = 1;

  veu.onend = function() {

    escoltar();

  };

  veu.onerror = function() {

    escoltar();

  };

  window.speechSynthesis.speak(veu);

}


/* =====================================================
   ESCOLTAR
===================================================== */

function escoltar() {

  if (
    !("webkitSpeechRecognition" in window) &&
    !("SpeechRecognition" in window)
  ) {

    document.getElementById("estat").innerText =
      "❌ Aquest navegador no permet reconeixement de veu.";

    document.getElementById("boto").disabled = false;

    return;

  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  reconeixement =
    new SpeechRecognition();

  reconeixement.lang =
    "ca-ES";

  reconeixement.continuous =
    false;

  reconeixement.interimResults =
    false;

  reconeixement.maxAlternatives =
    1;

  document.getElementById("estat").innerText =
    "🎤 Escoltant...";

  reconeixement.onresult =
    function(event) {

      const resposta =
        event.results[0][0].transcript.trim();

      document.getElementById("estat").innerText =
        "Resposta: " + resposta;

      processarResposta(resposta);

    };

  reconeixement.onerror =
    function(event) {

      document.getElementById("estat").innerText =
        "❌ Error de veu: " + event.error;

      if (
        event.error === "no-speech" ||
        event.error === "aborted"
      ) {

        setTimeout(function() {

          escoltar();

        }, 800);

      }

    };

  reconeixement.onend =
    function() {

      reconeixement = null;

    };

  try {

    reconeixement.start();

  }

  catch(error) {

    console.log(
      "Error iniciant micròfon:",
      error
    );

  }

}


/* =====================================================
   PROCESSAR RESPOSTA
===================================================== */

function processarResposta(resposta) {

  if (pas < preguntes.length) {

    const clau =
      preguntes[pas][0];

    dades[clau] =
      resposta;

    pas++;

    preguntar();

    return;

  }


  /* MATERIAL LLOGAT */

  if (pas === 6) {

    dades.material_llogat =
      esSi(resposta)
        ? "sí"
        : "no";

    if (esSi(resposta)) {

      pas = 7;

    }

    else {

      pas = 8;

    }

    preguntar();

    return;

  }


  /* QUIN MATERIAL LLOGAT */

  if (pas === 7) {

    dades.material_llogat_quin =
      resposta;

    pas = 8;

    preguntar();

    return;

  }


  /* FEINA NOVA */

  if (pas === 8) {

    dades.feina_nova =
      esSi(resposta)
        ? "sí"
        : "no";

    if (esSi(resposta)) {

      pas = 9;

    }

    else {

      pas = 10;

    }

    preguntar();

    return;

  }


  /* QUINA FEINA NOVA */

  if (pas === 9) {

    dades.feina_nova_quina =
      resposta;

    pas = 10;

    preguntar();

    return;

  }


  /* MATERIAL PENDENT */

  if (pas === 10) {

    dades.material_pendent =
      esSi(resposta)
        ? "sí"
        : "no";

    if (esSi(resposta)) {

      pas = 11;

    }

    else {

      pas = 12;

    }

    preguntar();

    return;

  }


  /* QUIN MATERIAL PENDENT */

  if (pas === 11) {

    dades.material_pendent_quin =
      resposta;

    pas = 12;

    preguntar();

    return;

  }


  /* OBSERVACIONS */

  if (pas === 12) {

    dades.observacions =
      resposta;

    guardar();

  }

}


/* =====================================================
   GUARDAR
===================================================== */

function guardar() {

  document.getElementById("pregunta").innerText =
    "💾 Enviant registre...";

  document.getElementById("estat").innerText =
    "Enviant les dades al Google Sheet...";

  console.log(
    "DADES A ENVIAR:",
    dades
  );

  const formulari =
    document.createElement("form");

  formulari.method =
    "POST";

  formulari.action =
    URL_SCRIPT;

  formulari.target =
    "enviamentOcult";

  const camp =
    document.createElement("input");

  camp.type =
    "hidden";

  camp.name =
    "dades";

  camp.value =
    JSON.stringify(dades);

  formulari.appendChild(camp);

  document.body.appendChild(formulari);

  formulari.submit();

  formulari.remove();

  document.getElementById("pregunta").innerText =
    "✅ Registre enviat";

  document.getElementById("estat").innerText =
    "Les dades s'han enviat al Google Sheet.";

  document.getElementById("boto").disabled =
    false;

}


/* =====================================================
   PROVA D'ENVIAMENT
===================================================== */

function provaEnviar() {

  dades = {

    client:
      "CLIENT PROVA",

    lloc:
      "LLOC PROVA",

    feina:
      "FEINA PROVA",

    hora_inici:
      "08:00",

    hora_final:
      "10:00",

    material:
      "MATERIAL PROVA",

    material_llogat:
      "no",

    material_llogat_quin:
      "",

    feina_nova:
      "no",

    feina_nova_quina:
      "",

    material_pendent:
      "no",

    material_pendent_quin:
      "",

    observacions:
      "PROVA ENVIAMENT"

  };

  guardar();

}

</script>

</body>

</html>

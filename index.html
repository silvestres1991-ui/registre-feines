<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registre de feines</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: 40px auto;
  padding: 20px;
}

button {
  font-size: 22px;
  padding: 15px 25px;
  margin: 10px 0;
  width: 100%;
}

#pregunta {
  font-size: 24px;
  margin: 30px 0;
  font-weight: bold;
}

#resposta {
  font-size: 20px;
}

#estat {
  margin-top: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>🎤 Registre de feines</h1>

<div id="pregunta">
  Prem el botó per començar
</div>

<button id="boto" onclick="comencar()">
  🎤 Començar registre
</button>

<button onclick="provaEnviar()">
  🧪 Prova enviament
</button>

<div id="resposta"></div>
<div id="estat"></div>

<iframe
  name="enviamentOcult"
  id="enviamentOcult"
  style="display:none;">
</iframe>

<script>

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbyCn9UPJIuY91m9iBzuOXmBFqf4bHw_80JYg0ZyhK91x1CrucWFh2IcyeJXIxkkDfuD/exec";


const preguntes = [

  ["client", "Quin és el client?"],

  ["lloc", "A quin lloc has fet la feina?"],

  ["feina", "Quina feina has realitzat?"],

  ["hora_inici", "A quina hora has començat?"],

  ["hora_final", "A quina hora has acabat?"],

  ["material", "Quin material has utilitzat?"],

  ["material_llogat", "Hi ha material llogat?"],

  ["material_llogat_quin", "Quin material has llogat?"],

  ["feina_nova", "Hi ha alguna feina nova per aquest client?"],

  ["feina_nova_quina", "Quina feina nova?"],

  ["material_pendent", "Hi ha algun material pendent de demanar?"],

  ["material_pendent_quin", "Quin material queda pendent de demanar?"],

  ["observacions", "Tens alguna observació?"]

];


let pas = 0;
let dades = {};


const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


let reconeixement;


if (SpeechRecognition) {

  reconeixement = new SpeechRecognition();

  reconeixement.lang = "ca-ES";

  reconeixement.continuous = false;

  reconeixement.interimResults = false;

}


function parlar(text) {

  const veu =
  new SpeechSynthesisUtterance(text);

  veu.lang = "ca-ES";

  veu.rate = 0.95;

  speechSynthesis.cancel();

  speechSynthesis.speak(veu);
}


function comencar() {

  pas = 0;

  dades = {};

  document.getElementById("boto").disabled = true;

  ferPregunta();

}


function ferPregunta() {

  if (pas >= preguntes.length) {

    guardar();

    return;

  }


  const pregunta =
  preguntes[pas][1];

  document.getElementById("pregunta").innerText =
  pregunta;

  parlar(pregunta);

  escoltar();

}


function escoltar() {

  if (!reconeixement) {

    alert(
      "Aquest navegador no admet reconeixement de veu."
    );

    return;

  }


  reconeixement.onresult =
  function(event) {

    const text =
    event.results[0][0].transcript.trim();

    document.getElementById("resposta").innerText =
    "Has dit: " + text;

    const camp =
    preguntes[pas][0];


    if (
      camp === "material_llogat" ||
      camp === "feina_nova" ||
      camp === "material_pendent"
    ) {

      const resposta =
      text.toLowerCase();

      if (
        resposta.includes("no")
      ) {

        dades[camp] = "No";

        if (camp === "material_llogat") {
          pas += 2;
        }

        else if (camp === "feina_nova") {
          pas += 2;
        }

        else if (camp === "material_pendent") {
          pas += 2;
        }

        ferPregunta();

        return;
      }

      dades[camp] = text;

      pas++;

      ferPregunta();

      return;

    }


    if (
      camp === "material_llogat_quin" &&
      dades.material_llogat !== "Sí"
    ) {

      pas++;

      ferPregunta();

      return;

    }


    if (
      camp === "feina_nova_quina" &&
      dades.feina_nova !== "Sí"
    ) {

      pas++;

      ferPregunta();

      return;

    }


    if (
      camp === "material_pendent_quin" &&
      dades.material_pendent !== "Sí"
    ) {

      pas++;

      ferPregunta();

      return;

    }


    dades[camp] = text;

    pas++;

    ferPregunta();

  };


  reconeixement.onerror =
  function(event) {

    document.getElementById("estat").innerText =
    "Error de micro: " + event.error;

  };


  reconeixement.start();

}


function guardar() {

  document.getElementById("pregunta").innerText =
  "💾 Guardant registre...";


  const formulari =
  document.createElement("form");

  formulari.method = "POST";

  formulari.action = URL_SCRIPT;

  formulari.target = "enviamentOcult";


  const camp =
  document.createElement("input");

  camp.type = "hidden";

  camp.name = "dades";

  camp.value =
  JSON.stringify(dades);


  formulari.appendChild(camp);

  document.body.appendChild(formulari);

  formulari.submit();

  formulari.remove();


  document.getElementById("pregunta").innerText =
  "✅ Registre enviat";


  document.getElementById("estat").innerText =
  "Les dades s'han enviat al Google Sheet.";


  document.getElementById("boto").disabled =
  false;

}


function provaEnviar() {

  const dadesProva = {

    client: "CLIENT PROVA",

    lloc: "LLOC PROVA",

    feina: "FEINA PROVA",

    hora_inici: "08:00",

    hora_final: "12:00",

    material: "MATERIAL PROVA",

    material_llogat: "No",

    material_llogat_quin: "",

    feina_nova: "No",

    feina_nova_quina: "",

    material_pendent: "No",

    material_pendent_quin: "",

    observacions: "PROVA ENVIAMENT"

  };


  guardarProva(dadesProva);

}


function guardarProva(dadesProva) {

  const formulari =
  document.createElement("form");

  formulari.method = "POST";

  formulari.action = URL_SCRIPT;

  formulari.target = "enviamentOcult";


  const camp =
  document.createElement("input");

  camp.type = "hidden";

  camp.name = "dades";

  camp.value =
  JSON.stringify(dadesProva);


  formulari.appendChild(camp);

  document.body.appendChild(formulari);

  formulari.submit();

  formulari.remove();


  document.getElementById("estat").innerText =
  "🧪 Prova enviada.";

}

</script>

</body>
</html>

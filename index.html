```html
<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registre de feines</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px;
  background: #f5f5f5;
}

h1 {
  font-size: 30px;
}

#pregunta {
  font-size: 26px;
  margin: 35px 10px;
}

#estat {
  font-size: 18px;
  margin: 20px;
}

button {
  font-size: 24px;
  padding: 20px 30px;
  border-radius: 15px;
  border: none;
  background: #222;
  color: white;
}
</style>
</head>

<body>

<h1>🎤 Registre de feines</h1>

<div id="pregunta">Prem el botó per començar</div>
<div id="estat"></div>

<button id="boto" onclick="comencar()">🎤 Començar registre</button>

<script>

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbyCn9UPJIuY91m9iBzuOXmBFqf4bHw_80gJY0ZyhK91x1CrucWFh2IcyeJXIxkkDfuD/exec";

const SpeechRecognition =
window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition;
let pas = 0;
let dades = {};

const preguntes = [
  {
    clau: "client",
    text: "Quin és el client?"
  },
  {
    clau: "lloc",
    text: "A quin lloc has fet la feina?"
  },
  {
    clau: "feina",
    text: "Quina feina has realitzat?"
  },
  {
    clau: "hora_inici",
    text: "A quina hora has començat?"
  },
  {
    clau: "hora_final",
    text: "A quina hora has acabat?"
  },
  {
    clau: "material",
    text: "Quin material has utilitzat?"
  }
];

function parlar(text) {

  document.getElementById("pregunta").innerText = text;
  document.getElementById("estat").innerText = "🔊 Parlant...";

  speechSynthesis.cancel();

  const veu = new SpeechSynthesisUtterance(text);
  veu.lang = "ca-ES";
  veu.rate = 1;

  veu.onend = function() {
    escoltar();
  };

  speechSynthesis.speak(veu);
}


function escoltar() {

  if (!SpeechRecognition) {
    document.getElementById("estat").innerText =
      "❌ Aquest navegador no admet reconeixement de veu.";
    return;
  }

  document.getElementById("estat").innerText =
    "🎤 Escoltant...";

  recognition = new SpeechRecognition();

  recognition.lang = "ca-ES";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = function(event) {

    const resposta =
      event.results[0][0].transcript.trim();

    document.getElementById("estat").innerText =
      "Has dit: " + resposta;

    processarResposta(resposta);
  };

  recognition.onerror = function(event) {

    console.log("Error:", event.error);

    if (event.error === "no-speech") {

      document.getElementById("estat").innerText =
        "🎤 No t'he sentit. Torna-ho a dir.";

      setTimeout(function() {
        escoltar();
      }, 1000);

    } else {

      document.getElementById("estat").innerText =
        "❌ Error de micro: " + event.error;
    }
  };

  recognition.onend = function() {
    // No fem res aquí.
  };

  try {
    recognition.start();
  } catch (error) {
    console.log(error);
  }
}


function processarResposta(resposta) {

  // PREGUNTES NORMALS

  if (pas < preguntes.length) {

    const pregunta = preguntes[pas];

    dades[pregunta.clau] = resposta;

    pas++;

    if (pas < preguntes.length) {

      setTimeout(function() {
        parlar(preguntes[pas].text);
      }, 500);

    } else {

      setTimeout(function() {
        parlar("Hi ha material llogat?");
      }, 500);

    }

    return;
  }


  // MATERIAL LLOGAT

  if (pas === 6) {

    dades.material_llogat = resposta;

    if (esSi(resposta)) {

      pas = 7;

      setTimeout(function() {
        parlar("Quin material has llogat?");
      }, 500);

    } else {

      pas = 8;

      setTimeout(function() {
        parlar("Hi ha alguna feina nova per aquest client?");
      }, 500);
    }

    return;
  }


  // QUIN MATERIAL LLOGAT

  if (pas === 7) {

    dades.material_llogat_quin = resposta;

    pas = 8;

    setTimeout(function() {
      parlar("Hi ha alguna feina nova per aquest client?");
    }, 500);

    return;
  }


  // FEINA NOVA

  if (pas === 8) {

    dades.feina_nova = resposta;

    if (esSi(resposta)) {

      pas = 9;

      setTimeout(function() {
        parlar("Quina feina nova?");
      }, 500);

    } else {

      pas = 10;

      setTimeout(function() {
        parlar("Hi ha algun material pendent de demanar?");
      }, 500);
    }

    return;
  }


  // QUINA FEINA NOVA

  if (pas === 9) {

    dades.feina_nova_quina = resposta;

    pas = 10;

    setTimeout(function() {
      parlar("Hi ha algun material pendent de demanar?");
    }, 500);

    return;
  }


  // MATERIAL PENDENT

  if (pas === 10) {

    dades.material_pendent = resposta;

    if (esSi(resposta)) {

      pas = 11;

      setTimeout(function() {
        parlar("Quin material queda pendent de demanar?");
      }, 500);

    } else {

      pas = 12;

      setTimeout(function() {
        parlar("Tens alguna observació?");
      }, 500);
    }

    return;
  }


  // QUIN MATERIAL PENDENT

  if (pas === 11) {

    dades.material_pendent_quin = resposta;

    pas = 12;

    setTimeout(function() {
      parlar("Tens alguna observació?");
    }, 500);

    return;
  }


  // OBSERVACIONS

  if (pas === 12) {

    dades.observacions = resposta;

    guardar();

    return;
  }
}


function esSi(text) {

  text = text.toLowerCase().trim();

  return (
    text.includes("sí") ||
    text.includes("si") ||
    text.includes("yes")
  );
}


function guardar() {

  document.getElementById("pregunta").innerText =
    "💾 Guardant registre...";

  document.getElementById("estat").innerText =
    "Enviant les dades al Google Sheet...";

  const formulari =
    document.createElement("form");

  formulari.method = "POST";
  formulari.action = URL_SCRIPT;
  formulari.target = "enviament";

  const input =
    document.createElement("input");

  input.type = "hidden";
  input.name = "dades";
  input.value = JSON.stringify(dades);

  formulari.appendChild(input);

  document.body.appendChild(formulari);

  formulari.submit();

  setTimeout(function() {

    document.getElementById("pregunta").innerText =
      "✅ Registre guardat!";

    document.getElementById("estat").innerText =
      "Ja pots començar un altre registre.";

    formulari.remove();

  }, 2000);
}


function comencar() {

  if (!SpeechRecognition) {

    alert(
      "Aquest navegador no admet reconeixement de veu."
    );

    return;
  }

  dades = {};
  pas = 0;

  document.getElementById("boto").disabled = true;

  parlar("Quin és el client?");
}

</script>

<iframe
  name="enviament"
  style="display:none">
</iframe>

</body>
</html>
```

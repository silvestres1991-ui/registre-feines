<!DOCTYPE html>
<html lang="ca">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Registre de feines</title>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px;
  background: #f5f5f5;
}

h1 {
  font-size: 30px;
}

#pregunta {
  font-size: 26px;
  margin: 35px 10px;
}

#estat {
  font-size: 18px;
  margin: 20px;
}

button {
  font-size: 24px;
  padding: 20px 30px;
  margin: 10px;
  border-radius: 15px;
  border: none;
  background: #222;
  color: white;
}

button:disabled {
  opacity: 0.5;
}

  background: #777;
}

</style>

</head>


<body>

<h1>🎤 Registre de feines</h1>


<div id="pregunta">
  Prem el botó per començar
</div>


<div id="estat"></div>


<button id="boto"
        onclick="comencar()">

  🎤 Començar registre

</button>


<br>


<button class="prova"
        onclick="provaEnviar()">

  🧪 PROVA ENVIAMENT

</button>


<script>


/* =====================================================
   URL GOOGLE APPS SCRIPT
===================================================== */

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbyCn9UPJIuY91m9iBzuOXmBFqf4bHw_80gJY0ZyhK91x1CrucWFh2IcyeJXIxkkDfuD/exec";


/* =====================================================
   RECONEIXEMENT DE VEU
===================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


let recognition = null;

let pas = 0;

let dades = {};

let processant = false;

let registrant = false;


/* =====================================================
   PREGUNTES
===================================================== */

const preguntes = [

  ["client",
   "Quin és el client?"],

  ["lloc",
   "A quin lloc has fet la feina?"],

  ["feina",
   "Quina feina has realitzat?"],

  ["hora_inici",
   "A quina hora has començat?"],

  ["hora_final",
   "A quina hora has acabat?"],

  ["material",
   "Quin material has utilitzat?"]

];


/* =====================================================
   PARLAR
===================================================== */

function parlar(text) {

  document.getElementById("pregunta").innerText =
    text;

  document.getElementById("estat").innerText =
    "🔊 Parlant...";


  speechSynthesis.cancel();


  const veu =
    new SpeechSynthesisUtterance(text);


  veu.lang = "ca-ES";

  veu.rate = 1;


  veu.onend = function() {

    if (registrant) {

      setTimeout(function() {

        escoltar();

      }, 400);

    }

  };


  speechSynthesis.speak(veu);

}


/* =====================================================
   ESCOLTAR
===================================================== */

function escoltar() {

  if (!registrant || processant) {
    return;
  }


  if (!SpeechRecognition) {

    document.getElementById("estat").innerText =
      "❌ Aquest navegador no admet reconeixement de veu.";

    return;
  }


  document.getElementById("estat").innerText =
    "🎤 Escoltant...";


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "ca-ES";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;


  recognition.onresult =
    function(event) {

      if (processant) {
        return;
      }


      processant = true;


      const resposta =
        event.results[0][0]
        .transcript
        .trim();


      document.getElementById("estat").innerText =
        "Has dit: " + resposta;


      try {
        recognition.stop();
      }
      catch (e) {}


      setTimeout(function() {

        processarResposta(resposta);

        processant = false;

      }, 300);

    };


  recognition.onerror =
    function(event) {

      console.log(
        "Error de veu:",
        event.error
      );


      if (!registrant) {
        return;
      }


      if (event.error === "no-speech") {

        document.getElementById("estat").innerText =
          "🎤 No t'he sentit. Torna-ho a dir.";


        setTimeout(function() {

          if (!processant && registrant) {

            escoltar();

          }

        }, 1000);

      }


      else if (event.error === "not-allowed") {

        document.getElementById("estat").innerText =
          "❌ Chrome no permet utilitzar el micròfon.";

      }


      else {

        document.getElementById("estat").innerText =
          "❌ Error de micro: " +
          event.error;

      }

    };


  recognition.onend =
    function() {

      // No reiniciem aquí.

    };


  try {

    recognition.start();

  }

  catch (error) {

    console.log(
      "Error iniciant el micro:",
      error
    );

  }

}


/* =====================================================
   PROCESSAR RESPOSTES
===================================================== */

function processarResposta(resposta) {


  /* -----------------------------------------------
     PREGUNTES 1-6
  ------------------------------------------------ */

  if (pas < preguntes.length) {

    const clau =
      preguntes[pas][0];


    dades[clau] =
      resposta;


    pas++;


    if (pas < preguntes.length) {

      parlar(
        preguntes[pas][1]
      );

    }

    else {

      parlar(
        "Hi ha material llogat?"
      );

    }

    return;

  }


  /* -----------------------------------------------
     MATERIAL LLOGAT
  ------------------------------------------------ */

  if (pas === 6) {

    dades.material_llogat =
      resposta;


    if (esSi(resposta)) {

      pas = 7;

      parlar(
        "Quin material has llogat?"
      );

    }

    else {

      dades.material_llogat_quin =
        "";

      pas = 8;

      parlar(
        "Hi ha alguna feina nova per aquest client?"
      );

    }

    return;

  }


  /* -----------------------------------------------
     QUIN MATERIAL LLOGAT
  ------------------------------------------------ */

  if (pas === 7) {

    dades.material_llogat_quin =
      resposta;


    pas = 8;


    parlar(
      "Hi ha alguna feina nova per aquest client?"
    );


    return;

  }


  /* -----------------------------------------------
     FEINA NOVA
  ------------------------------------------------ */

  if (pas === 8) {

    dades.feina_nova =
      resposta;


    if (esSi(resposta)) {

      pas = 9;


      parlar(
        "Quina feina nova?"
      );

    }

    else {

      dades.feina_nova_quina =
        "";

      pas = 10;


      parlar(
        "Hi ha algun material pendent de demanar?"
      );

    }


    return;

  }


  /* -----------------------------------------------
     QUINA FEINA NOVA
  ------------------------------------------------ */

  if (pas === 9) {

    dades.feina_nova_quina =
      resposta;


    pas = 10;


    parlar(
      "Hi ha algun material pendent de demanar?"
    );


    return;

  }


  /* -----------------------------------------------
     MATERIAL PENDENT
  ------------------------------------------------ */

  if (pas === 10) {

    dades.material_pendent =
      resposta;


    if (esSi(resposta)) {

      pas = 11;


      parlar(
        "Quin material queda pendent de demanar?"
      );

    }

    else {

      dades.material_pendent_quin =
        "";

      pas = 12;


      parlar(
        "Tens alguna observació?"
      );

    }


    return;

  }


  /* -----------------------------------------------
     QUIN MATERIAL PENDENT
  ------------------------------------------------ */

  if (pas === 11) {

    dades.material_pendent_quin =
      resposta;


    pas = 12;


    parlar(
      "Tens alguna observació?"
    );


    return;

  }


  /* -----------------------------------------------
     OBSERVACIONS
  ------------------------------------------------ */

  if (pas === 12) {

    dades.observacions =
      resposta;


    registrant =
      false;


    guardar();


    return;

  }

}


/* =====================================================
   DETECTAR SÍ
===================================================== */

function esSi(text) {

  text =
    text
      .toLowerCase()
      .trim()
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      );


  return (

    text === "si" ||

    text.startsWith("si ") ||

    text.includes(" si")

  );

}


/* =====================================================
   ENVIAR AL GOOGLE SHEETS
===================================================== */

function guardar() {

  document.getElementById("pregunta").innerText =
    "💾 Enviant registre...";


  document.getElementById("estat").innerText =
    "Enviant les dades al Google Sheet...";


  console.log(
    "DADES A ENVIAR:",
    dades
  );


  const formulari =
    document.createElement("form");


  formulari.method =
    "POST";


  formulari.action =
    URL_SCRIPT;


  formulari.target =
    "_blank";


  const camp =
    document.createElement("input");


  camp.type =
    "hidden";


  camp.name =
    "dades";


  camp.value =
    JSON.stringify(dades);


  formulari.appendChild(
    camp
  );


  document.body.appendChild(
    formulari
  );


  formulari.submit();


  formulari.remove();


  document.getElementById("pregunta").innerText =
    "✅ Registre enviat";


  document.getElementById("estat").innerText =
    "Comprova ara el Google Sheet.";


  document.getElementById("boto").disabled =
    false;

}


/* =====================================================
   PROVA DIRECTA
===================================================== */

function provaEnviar() {

  dades = {

    client:
      "CLIENT PROVA",

    lloc:
      "LLOC PROVA",

    feina:
      "FEINA PROVA",

    hora_inici:
      "08:00",

    hora_final:
      "10:00",

    material:
      "MATERIAL PROVA",

    material_llogat:
      "no",

    material_llogat_quin:
      "",

    feina_nova:
      "no",

    feina_nova_quina:
      "",

    material_pendent:
      "no",

    material_pendent_quin:
      "",

    observacions:
      "PROVA ENVIAMENT"

  };


  guardar();

}


/* =====================================================
   COMENÇAR REGISTRE
===================================================== */

function comencar() {

  if (!SpeechRecognition) {

    alert(
      "Aquest navegador no admet reconeixement de veu."
    );

    return;

  }


  dades = {};

  pas = 0;

  processant = false;

  registrant = true;


  document.getElementById("boto").disabled =
    true;


  parlar(
    "Quin és el client?"
  );

}

</script>

</body>

</html>
